[package]
name = "float-cmp"
version = "0.11.0-pre-gnomonic"
publish = ["gnomonic"]
authors = ["Mike Dilger <mike@mikedilger.com>"]
description = "Floating point approximate comparison traits"
repository = "https://github.com/mikedilger/float-cmp"
documentation = "https://docs.rs/float-cmp"
readme = "README.md"
keywords = [ "float", "comparison", "fuzzy", "approximate", "no_std" ]
license = "MIT"
edition = "2018"

[lib]
name = "float_cmp"
path = "src/lib.rs"
test = true
doctest = true
doc = true

[features]
default = [ "ratio" ]
ratio = [ "num-traits" ]
std = [ ]

[dependencies]
num-traits = { version = "0.2.19", default-features = false, optional = true }
ordered-float = { version = "5.5.0-gnomonic", registry = "gnomonic", features = [ "serde", "bytemuck", "bitcode" ], optional = true }
